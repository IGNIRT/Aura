<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Мастерская</title>
  <link href="lib/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="login-wrap">
    <div class="card shadow-sm border-0" style="max-width: 420px; width: 100%;">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="logo-box mb-3">
            <img src="image/logo.jpg" alt="Логотип" class="logo-img">
          </div>
          <h4 class="fw-bold mb-1">Мастерская</h4>
          <p class="text-muted small mb-0">Ремонт бытовой техники</p>
        </div>

        <p class="text-center text-muted small mb-4">
          Учёт заказов · База клиентов · Склад запчастей · Аналитика
        </p>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label small text-muted">Логин</label>
            <input type="text" id="login" class="form-control" placeholder="admin" required autocomplete="username">
          </div>
          <div class="mb-4">
            <label class="form-label small text-muted">Пароль</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required
              autocomplete="current-password">
          </div>
          <div id="error" class="alert alert-danger small py-2 d-none"></div>
          <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>

        <p class="text-center text-muted xsmall mt-4 mb-0">
          Специализированное решение для мастерских по ремонту техники
        </p>
      </div>
    </div>
  </div>
  <script src="lib/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Если уже авторизован — сразу в заказы
    if (App.isLoggedIn()) location.href = 'orders.html';

    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const login = document.getElementById('login').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('error');

      // TODO: заменить на fetch('/api/login', {...})
      if (App.login(login, password)) {
        location.href = 'orders.html';
      } else {
        err.textContent = 'Неверный логин или пароль';
        err.classList.remove('d-none');
      }
    });
  </script>
</body>

</html>
