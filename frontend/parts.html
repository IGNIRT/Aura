<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Склад — Мастерская</title>
  <link href="lib/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold mb-0">Склад запчастей</h4>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#partModal" onclick="editPart(null)">
        <i class="bi bi-plus-lg me-1"></i>Добавить позицию
      </button>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Наименование</th>
              <th>Артикул</th>
              <th>Категория</th>
              <th>Остаток</th>
              <th>Цена закупки</th>
              <th>Поставщик</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="partsBody"></tbody>
        </table>
      </div>
      <div id="empty" class="text-center text-muted py-5 d-none">Склад пуст.</div>
    </div>
  </main>

  <div class="modal fade" id="partModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="partForm">
          <div class="modal-header">
            <h5 class="modal-title" id="partModalTitle">Новая позиция</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="partId">
            <div class="mb-3">
              <label class="form-label small text-muted">Наименование</label>
              <input type="text" id="name" class="form-control" required>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small text-muted">Артикул</label>
                <input type="text" id="sku" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Категория</label>
                <select id="category" class="form-select">
                  <option>Подшипники</option>
                  <option>ТЭНы</option>
                  <option>Ремни</option>
                  <option>Манжеты</option>
                  <option>Модули</option>
                  <option>Фильтры</option>
                  <option>Прочее</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Остаток, шт</label>
                <input type="number" id="qty" class="form-control" min="0" value="0">
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Цена закупки, ₽</label>
                <input type="number" id="cost" class="form-control" min="0" step="1">
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Цена продажи, ₽</label>
                <input type="number" id="price" class="form-control" min="0" step="1">
              </div>
              <div class="col-12">
                <label class="form-label small text-muted">Поставщик</label>
                <input type="text" id="vendor" class="form-control">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
            <button type="submit" class="btn btn-primary">Сохранить</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="lib/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    App.requireAuth();
    App.renderNav('parts');

    function load() {
      const parts = App.getData('parts') || [];
      const body = document.getElementById('partsBody');
      const empty = document.getElementById('empty');
      body.innerHTML = '';
      if (!parts.length) { empty.classList.remove('d-none'); return; }
      empty.classList.add('d-none');
      parts.forEach(p => {
        const low = p.qty <= 1;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="fw-semibold">${App.esc(p.name)}</td>
          <td class="text-muted small">${App.esc(p.sku || '—')}</td>
          <td><span class="badge bg-light text-dark">${App.esc(p.category)}</span></td>
          <td>${low ? '<span class="text-danger fw-semibold">' + p.qty + ' ⚠</span>' : p.qty}</td>
          <td>${p.cost ? p.cost + ' ₽' : '—'}</td>
          <td class="text-muted small">${App.esc(p.vendor || '—')}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary me-1" onclick="editPart(${p.id})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="del(${p.id})"><i class="bi bi-trash"></i></button>
          </td>`;
        body.appendChild(tr);
      });
    }

    window.editPart = function (id) {
      const parts = App.getData('parts') || [];
      const p = id ? parts.find(x => x.id === id) : null;
      document.getElementById('partModalTitle').textContent = p ? 'Редактировать позицию' : 'Новая позиция';
      document.getElementById('partId').value = p ? p.id : '';
      document.getElementById('name').value = p ? p.name : '';
      document.getElementById('price').value = p ? (p.price||'') : '';
      document.getElementById('sku').value = p ? (p.sku || '') : '';
      document.getElementById('category').value = p ? p.category : 'Подшипники';
      document.getElementById('qty').value = p ? p.qty : 0;
      document.getElementById('cost').value = p ? (p.cost || '') : '';
      document.getElementById('vendor').value = p ? (p.vendor || '') : '';
    };

    window.del = function (id) {
      if (!confirm('Удалить позицию?')) return;
      App.setData('parts', App.getData('parts').filter(p => p.id !== id));
      load();
    };

    document.getElementById('partForm').addEventListener('submit', e => {
      e.preventDefault();
      const parts = App.getData('parts') || [];
      const id = +document.getElementById('partId').value;
      const data = {
        name: document.getElementById('name').value.trim(),
        price: +document.getElementById('price').value || 0,
        sku: document.getElementById('sku').value.trim(),
        category: document.getElementById('category').value,
        qty: +document.getElementById('qty').value || 0,
        cost: +document.getElementById('cost').value || 0,
        vendor: document.getElementById('vendor').value.trim()
      };
      if (id) {
        Object.assign(parts.find(x => x.id === id), data);
      } else {
        data.id = parts.length ? Math.max(...parts.map(x => x.id)) + 1 : 1;
        parts.push(data);
      }
      App.setData('parts', parts);
      bootstrap.Modal.getInstance(document.getElementById('partModal')).hide();
      load();
    });

    load();
  </script>
</body>

</html>
