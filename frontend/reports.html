<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Отчёты — Мастерская</title>
  <link href="lib/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="navbar"></div>
  <main class="container py-4">
    <h4 class="fw-bold mb-4">Отчёты</h4>
    <div class="row g-3 mb-4">
      <div class="col-md-3 col-6"><div class="card border-0 shadow-sm"><div class="card-body"><div class="text-muted small">Всего заказов</div><div class="fs-3 fw-bold" id="totalOrders">0</div></div></div></div>
      <div class="col-md-3 col-6"><div class="card border-0 shadow-sm"><div class="card-body"><div class="text-muted small">В работе</div><div class="fs-3 fw-bold text-primary" id="inWork">0</div></div></div></div>
      <div class="col-md-3 col-6"><div class="card border-0 shadow-sm"><div class="card-body"><div class="text-muted small">Выручка, ₽</div><div class="fs-3 fw-bold text-success" id="revenue">0</div></div></div></div>
      <div class="col-md-3 col-6"><div class="card border-0 shadow-sm"><div class="card-body"><div class="text-muted small">Долг, ₽</div><div class="fs-3 fw-bold text-danger" id="debt">0</div></div></div></div>
    </div>
    <div class="row g-3">
      <div class="col-md-6"><div class="card border-0 shadow-sm"><div class="card-header bg-white">Заказы по статусам</div><div class="card-body" id="statusReport"></div></div></div>
      <div class="col-md-6"><div class="card border-0 shadow-sm"><div class="card-header bg-white">Низкий остаток запчастей</div><div class="card-body" id="lowStock"></div></div></div>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    App.requireAuth(); App.renderNav('reports');
    const orders = App.getData('orders'), parts = App.getData('parts');
    document.getElementById('totalOrders').textContent = orders.length;
    document.getElementById('inWork').textContent = orders.filter(o=>['diagnosis','in_work','waiting_parts'].includes(o.status)).length;
    document.getElementById('revenue').textContent = App.money(orders.filter(o=>o.status==='issued'&&o.isPaid).reduce((s,o)=>s+(o.totalPrice||0),0));
    document.getElementById('debt').textContent = App.money(orders.filter(o=>o.status==='issued'&&!o.isPaid).reduce((s,o)=>s+(o.totalPrice||0),0));
    const labels = { accepted:'Принят', diagnosis:'Диагностика', in_work:'В работе', waiting_parts:'Ждёт запчасти', ready:'Готов к выдаче', issued:'Выдан' };
    const by = {}; orders.forEach(o=>by[o.status]=(by[o.status]||0)+1);
    document.getElementById('statusReport').innerHTML = Object.keys(labels).map(k=>`<div class="d-flex justify-content-between py-1 border-bottom"><span>${labels[k]}</span><span class="fw-semibold">${by[k]||0}</span></div>`).join('') || '<div class="text-muted">Нет данных</div>';
    const low = parts.filter(p=>p.qty<=1);
    document.getElementById('lowStock').innerHTML = low.length ? low.map(p=>`<div class="d-flex justify-content-between py-1 border-bottom"><span>${App.esc(p.name)}</span><span class="text-danger fw-semibold">${p.qty} шт</span></div>`).join('') : '<div class="text-muted">Всё в порядке 👍</div>';
  </script>
</body>
</html>
